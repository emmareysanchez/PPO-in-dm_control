experiment:
  name: walker_sac_simple
  device: cuda
  seed: 0

environment:
  env_id: Walker2d-v5
  obs_h: 64
  obs_w: 64
  frame_stack: 3
  grayscale: true
  action_repeat: 1
  time_limit: 1000
  n_envs: 1
  reward_shaping: true
  terminate_when_unhealthy: true
  healthy_z_range: [0.8, 2.0]

architecture:
  hidden_dim: 256

sac:
  lr: 1e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_size: 300000
  train_freq: 1
  target_update_interval: 1
  ent_coef: auto

train:
  total_steps: 5000000
  gradient_steps: 4
  learning_starts: 50000
  checkpoint_freq: 200000
  eval_freq: 100000
  eval_episodes: 3

logging:
  save_freq: 100000
  log_dir: runs/sac