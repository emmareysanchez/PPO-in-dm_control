experiment:
  name: walker_sac_visual_continuous
  device: cuda
  seed: 0

environment:
  env_id: Walker2d-v5
  obs_h: 84
  obs_w: 84
  frame_stack: 4
  grayscale: false
  action_repeat: 2         # action repeat ayuda mucho en pixel-SAC
  time_limit: 1000
  n_envs: 1

architecture:
  hidden_dim: 256

sac:
  lr: 3e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_size: 100000      # ~8GB RAM con float32; vigila el uso
  train_freq: 1
  target_update_interval: 1
  ent_coef: "auto"

train:
  total_steps: 10000000     # mínimo realista para pixel-based
  gradient_steps: 2        # más eficiencia muestral
  learning_starts: 20000
  checkpoint_freq: 100000
  video_freq: 100000
  num_videos: 4
  eval_freq: 25000
  eval_episodes: 5

logging:
  save_freq: 100000
  log_dir: runs/sac