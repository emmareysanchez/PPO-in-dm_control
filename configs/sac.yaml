experiment:
  name: walker_sac_visual_continuous
  device: cuda
  seed: 0

environment:
  env_id: Walker2d-v5
  obs_h: 84
  obs_w: 84
  frame_stack: 4
  grayscale: false
  action_repeat: 1
  time_limit: 1000
  # SAC is off-policy: typically n_envs=1. Increase only if you want
  # parallel data collection (less common with SAC).
  n_envs: 1

architecture:
  hidden_dim: 256

sac:
  lr: 3e-4
  gamma: 0.99
  tau: 0.005                   # Polyak averaging coefficient for target networks
  batch_size: 256
  buffer_size: 300000          # Replay buffer (reduce if GPU VRAM is limited)
  train_freq: 1                # Collect 1 env step before each gradient update
  target_update_interval: 1   # Update target networks every N gradient steps
  ent_coef: "auto"             # "auto" = learned temperature; or set a float e.g. 0.1

train:
  total_steps: 1000000
  gradient_steps: 1            # Gradient updates per env step (increase for more sample efficiency)
  learning_starts: 10000       # Fill replay buffer before training begins
  checkpoint_freq: 50000
  video_freq: 50000
  num_videos: 4
  eval_freq: 10000
  eval_episodes: 5

logging:
  save_freq: 50000
  log_dir: runs/sac