experiment:
  name: walker_sac_visual_continuous
  device: cuda
  seed: 0

environment:
  env_id: Walker2d-v5
  obs_h: 64
  obs_w: 64
  frame_stack: 3
  grayscale: true
  action_repeat: 1
  time_limit: 1000
  n_envs: 1

architecture:
  hidden_dim: 256        # antes 128, muy pequeño para CNN visual

sac:
  lr: 1e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 128
  buffer_size: 200000
  train_freq: 1
  target_update_interval: 1
  ent_coef: auto         # antes 0.2 fijo, peligroso con obs visuales

train:
  total_steps: 3000000
  gradient_steps: 1
  learning_starts: 20000
  checkpoint_freq: 200000
  video_freq: 100000
  num_videos: 4
  eval_freq: 50000
  eval_episodes: 3

logging:
  save_freq: 100000
  log_dir: runs/sac