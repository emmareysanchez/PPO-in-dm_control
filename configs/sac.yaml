experiment:
  name: walker_sac_visual_continuous
  device: cuda
  seed: 0

environment:
  env_id: Walker2d-v5
  obs_h: 64
  obs_w: 64
  frame_stack: 3
  grayscale: true
  action_repeat: 2
  time_limit: 1000
  n_envs: 1

architecture:
  hidden_dim: 256

sac:
  lr: 3e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 128
  buffer_size: 200000
  train_freq: 4
  target_update_interval: 1
  ent_coef: 0.2

train:
  total_steps: 3000000
  gradient_steps: 4
  learning_starts: 10000
  checkpoint_freq: 200000
  video_freq: 100000
  num_videos: 4
  eval_freq: 50000
  eval_episodes: 3

logging:
  save_freq: 100000
  log_dir: runs/sac